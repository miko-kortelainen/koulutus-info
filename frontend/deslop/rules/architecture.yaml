id: architecture
name: Frontend architecture
description: >-
  Route-oriented modules for yhteishaku.app. Dependencies point toward stable
  shared interfaces: routes compose feature modules, UI uses hooks and pure logic,
  and data, configuration, generated values, and types stay framework-neutral.
rules:
  - id: routes-isolated
    description: >-
      Each top-level Vike route is an independent feature module. It may compose its
      own modules and shared interfaces, but no other route. This keeps route
      changes local.
    target: "@/pages/{{file-name}}/**"
    exclude:
      - "**/*.test"
    forbids:
      - import: "@/**"
    allows:
      - import: "@/pages/{{file-name}}/**"
      - import: "@/pages/+Head"
      - import: "@/api/**"
      - import: "@/components/**"
      - import: "@/config/**"
      - import: "@/hooks/**"
      - import: "@/layout/**"
      - import: "@/lib/**"
      - import: "@/theme"
      - import: "@/types**"
    fix: >-
      Keep feature code inside src/pages/{{file-name}}/. Move cross-route code
      to the shared module that owns its behavior.

  - id: error-route-isolated
    description: >-
      The Vike _error route may use stable shared interfaces, but must not
      depend on another route module.
    target: "@/pages/_error/**"
    forbids:
      - import: "@/**"
    allows:
      - import: "@/pages/_error/**"
      - import: "@/components/**"
      - import: "@/config/**"
      - import: "@/layout/**"
      - import: "@/lib/**"
      - import: "@/theme"
      - import: "@/types**"
    fix: >-
      Remove the route import. Put shared UI or behavior in its owning shared
      module.

  - id: page-shell-no-routes
    description: >-
      Site-wide Vike shell files (+Layout, +Wrapper, +Head, +config) compose
      providers and layout from stable shared interfaces, never route modules.
    target: "@/pages/+*"
    forbids:
      - import: "@/**"
    allows:
      - import: "@/pages/+*"
      - import: "@/components/**"
      - import: "@/config/**"
      - import: "@/hooks/**"
      - import: "@/layout/**"
      - import: "@/lib/**"
      - import: "@/theme"
      - import: "@/types**"
    fix: >-
      Keep route-specific behavior in its route. Compose the shell from the
      listed shared interfaces.

  - id: components-layer
    description: >-
      Modules under @/components are reusable UI. They may use hooks, lib, config,
      theme, and types, but not api, layout, or pages — those pull data access
      or route ownership into the shared UI layer.
    target: "@/components/**"
    exclude:
      - "**/*.test"
    forbids:
      - import: "@/**"
    allows:
      - import: "@/components/**"
      - import: "@/hooks/**"
      - import: "@/lib/**"
      - import: "@/config/**"
      - import: "@/theme"
      - import: "@/types**"
    fix: >-
      Call data through a page or shared hook instead of @/api. Keep app-shell
      chrome in @/layout. Do not import route modules from shared UI modules.

  - id: hooks-layer
    description: >-
      Shared hooks hold reusable client logic. They may use the browser data
      adapter, lib, config, and types, but not the server data adapter,
      components, layout, or pages.
    target: "@/hooks/**"
    exclude:
      - "**/*.test"
    forbids:
      - import: "@/**"
      - import: "@/api/serverData"
        transitive: true
    allows:
      - import: "@/hooks/**"
      - import: "@/api/browserData"
      - import: "@/api/dataValidation"
      - import: "@/config/**"
      - import: "@/lib/**"
      - import: "@/types**"
    fix: >-
      Use @/api/browserData for browser data. Keep UI in components or pages.
      Shared hooks should depend on data and pure helpers, not UI modules.

  - id: api-layer
    description: >-
      @/api is the data seam for static JSON. It may use lib, config, and
      types, but must not import React UI, hooks, layout, or pages.
    target: "@/api/**"
    exclude:
      - "**/*.test"
    forbids:
      - import: "react"
        transitive: true
      - import: "react-dom"
        transitive: true
      - import: "@chakra-ui/**"
        transitive: true
      - import: "@tanstack/**"
        transitive: true
      - import: "@/**"
    allows:
      - import: "@/api/**"
      - import: "@/config/**"
      - import: "@/lib/**"
      - import: "@/types**"
    fix: >-
      Keep validation and fetch helpers free of UI. Put React and Query usage
      in hooks or pages that call @/api.

  - id: lib-is-pure
    description: >-
      @/lib is shared pure domain and formatting logic. It may use config and
      types, but not React, UI, hooks, layout, pages, or the data seam.
    target: "@/lib/**"
    exclude:
      - "**/*.test"
    forbids:
      - import: "react"
        transitive: true
      - import: "react-dom"
        transitive: true
      - import: "@chakra-ui/**"
        transitive: true
      - import: "@tanstack/**"
        transitive: true
      - import: "@/**"
    allows:
      - import: "@/config/**"
      - import: "@/lib/**"
      - import: "@/types**"
    fix: >-
      Move React or data-access logic into a hook, component, or @/api module.
      Keep @/lib to pure functions.

  - id: layout-layer
    description: >-
      @/layout owns the app shell. It may use shared UI, hooks, lib, config,
      theme, and types, but not pages or the data-access layer.
    target: "@/layout/**"
    exclude:
      - "**/*.test"
    forbids:
      - import: "@/**"
      - import: "@/api/**"
        transitive: true
    allows:
      - import: "@/components/**"
      - import: "@/config/**"
      - import: "@/hooks/**"
      - import: "@/layout/**"
      - import: "@/lib/**"
      - import: "@/theme"
      - import: "@/types**"
    fix: >-
      Fetch data in pages or hooks. Keep route feature code under @/pages.
      Layout should only compose shell chrome.

  - id: config-deps
    description: >-
      @/config holds runtime-neutral season and round configuration. It may
      depend on other config modules, generated data, @/lib, and types, but
      not UI, client state, data adapters, routes, or tests.
    target: "@/config/**"
    forbids:
      - import: "react"
        transitive: true
      - import: "react-dom"
        transitive: true
      - import: "@chakra-ui/**"
        transitive: true
      - import: "@tanstack/**"
        transitive: true
      - import: "@/**"
    allows:
      - import: "@/config/**"
      - import: "@/generated/**"
      - import: "@/lib/**"
      - import: "@/types**"
    fix: >-
      Import generated manifest values, @/lib helpers, or types only. Move UI
      or data-access concerns out of config.

  - id: browser-api-stays-browser-safe
    description: >-
      @/api/browserData is the browser data adapter. Node built-ins and the
      server adapter must not be reachable through its interface.
    target: "@/api/browserData"
    forbids:
      - import: "node:**"
        transitive: true
      - import: "@/api/serverData"
        transitive: true
    fix: >-
      Keep filesystem access in @/api/serverData. Put shared parsing and types
      in @/api/dataValidation, then call them from each adapter.

  - id: theme-is-low-level
    description: >-
      @/theme is the shared UI configuration module. Chakra is its only dependency.
    target: "@/theme"
    forbids:
      - import: "**"
    allows:
      - import: "@chakra-ui/**"
    fix: >-
      Keep only theme tokens and Chakra configuration in @/theme. Move runtime
      behavior to its owning hook, UI module, layout, or route.

  - id: generated-data-is-a-leaf
    description: >-
      Generated manifests are dependency-free data leaves. This keeps codegen
      output portable and prevents application logic from hiding in generated
      files.
    target: "@/generated/**"
    forbids:
      - import: "**"
    fix: >-
      Remove the import. Generate plain values only, then interpret them in
      @/config or another owning module.

  - id: type-contracts-stay-portable
    description: >-
      Shared type contracts may compose other type contracts and nothing else.
    target: "@/types**"
    forbids:
      - import: "**"
    allows:
      - import: "@/types**"
    fix: >-
      Keep the contract framework-neutral. Import another @/types contract or
      compose the application-specific type in the module that owns behavior.

  - id: no-tests-in-prod
    description: >-
      Test helpers must never be reachable from shipping modules.
    target: "**/*"
    exclude:
      - "**/*.test"
      - "**/*.spec"
      - "**/*.stories"
      - "@/test/**"
      - "**/vitest.*"
      - "**/playwright.*"
    forbids:
      - import: "@/test/**"
        transitive: true
      - import: "**/*.test"
        transitive: true
      - import: "**/*.spec"
        transitive: true
      - import: "**/*.stories"
        transitive: true
    fix: >-
      Remove the test import from production code. If a helper is needed at
      runtime, move it to a non-test module under @/lib or the owning feature.
